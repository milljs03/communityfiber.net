<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Checker</title>
    <meta name="robots" content="noindex, nofollow">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --npt-blue: #0663AF;
            --npt-lt-blue: #64ADD9;
            --font-body: 'Open Sans', sans-serif;
            --font-heading: 'Montserrat', sans-serif;
        }

        * { box-sizing: border-box; }

        html {
            background: transparent;
        }

        body {
            font-family: var(--font-body);
            margin: 0;
            padding: 0;
            background: transparent;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-heading);
        }

        html.is-embedded,
        html.is-embedded body {
            overflow: hidden;
        }

        .embed-shell {
            position: relative;
            max-width: 860px;
            margin: 0 auto;
            border-radius: 28px;
            padding: 44px 24px 42px;
            background: linear-gradient(135deg, #0f172a 0%, #0663AF 100%);
            color: #fff;
            text-align: center;
            overflow: hidden;
        }

        .embed-shell::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(255,255,255,0.07) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 760px;
            margin: 0 auto;
        }

        .hero-title {
            margin: 0 0 14px 0;
            font-size: 2.15rem;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.5px;
            color: #fff;
        }

        .highlight-text {
            color: var(--npt-lt-blue);
            background: -webkit-linear-gradient(45deg, var(--npt-lt-blue), #e2e8f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            margin: 0 0 24px 0;
            font-size: 1.05rem;
            line-height: 1.6;
            color: #cdd9ea;
        }

        .availability-search-container {
            max-width: 620px;
            margin: 0 auto;
            position: relative;
            z-index: 5;
        }

        .search-input-wrapper {
            position: relative;
            background: #fff;
            border-radius: 999px;
            padding: 8px;
            display: flex;
            align-items: center;
            box-shadow: 0 20px 28px rgba(3, 14, 34, 0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .search-input-wrapper:focus-within {
            transform: translateY(-2px);
            box-shadow: 0 24px 34px rgba(6, 99, 175, 0.35);
        }

        .search-icon {
            width: 22px;
            height: 22px;
            color: #94a3b8;
            margin-left: 14px;
            flex-shrink: 0;
            transition: color 0.2s ease;
        }

        .search-input-wrapper:focus-within .search-icon {
            color: var(--npt-blue);
        }

        #cfn-address-input {
            width: 100%;
            border: none;
            outline: none;
            padding: 12px 18px 12px 10px;
            font-size: 1rem;
            border-radius: 999px;
            color: #0f172a;
            background: transparent;
            font-family: var(--font-body);
        }

        #cfn-address-input::placeholder {
            color: #7b8794;
        }

        #redirect-message {
            margin-top: 12px;
            font-size: 0.9rem;
            color: var(--npt-lt-blue);
            font-weight: 600;
        }

        .business-contact {
            margin-top: 16px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid rgba(100, 173, 217, 0.44);
            background: rgba(6, 99, 175, 0.2);
            color: #dbeafe;
            font-size: 0.92rem;
            font-weight: 600;
        }

        .business-contact a {
            color: #ffffff;
            font-weight: 800;
            text-decoration: none;
            letter-spacing: 0.2px;
        }

        .business-contact a:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none;
        }

        .pac-container {
            position: fixed !important;
            z-index: 10000 !important;
            border-radius: 12px;
            margin-top: 8px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.2);
            border: none;
            font-family: var(--font-body) !important;
            max-height: min(280px, calc(100vh - 120px));
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }

        .pac-item {
            padding: 12px 16px;
            font-size: 15px;
            cursor: pointer;
            border-top: 1px solid #f1f5f9;
            color: #334155;
        }

        .pac-item:first-child { border-top: none; }

        .pac-item-query {
            color: #0f172a;
            font-weight: 600;
            font-size: 16px;
        }

        .cfn-address-suggestions {
            position: absolute;
            left: 0;
            right: 0;
            top: calc(100% + 10px);
            z-index: 10000;
            overflow: hidden;
            border-radius: 12px;
            background: #ffffff;
            box-shadow: 0 16px 34px rgba(3, 14, 34, 0.28);
            text-align: left;
        }

        .cfn-address-suggestions[hidden] {
            display: none;
        }

        .cfn-address-suggestion {
            width: 100%;
            border: 0;
            border-top: 1px solid #e2e8f0;
            padding: 0.85rem 1rem;
            background: #ffffff;
            color: #0f172a;
            cursor: pointer;
            font-family: var(--font-body);
            font-size: 0.95rem;
            font-weight: 700;
            text-align: left;
        }

        .cfn-address-suggestion:first-child {
            border-top: 0;
        }

        .cfn-address-suggestion:hover,
        .cfn-address-suggestion.is-active {
            background: #eff6ff;
        }

        @media (max-width: 740px) {
            body { padding: 0; }
            .embed-shell {
                border-radius: 20px;
                padding: 30px 16px 28px;
            }
            .search-input-wrapper {
                border-radius: 18px;
                padding: 8px 10px;
            }
            .search-icon {
                margin-left: 4px;
            }
            #cfn-address-input {
                min-width: 0;
                padding-right: 4px;
            }
            .hero-title {
                font-size: 1.7rem;
            }
            .hero-subtitle {
                font-size: 0.96rem;
                margin-bottom: 18px;
            }
        }
    </style>
</head>
<body>

<div class="embed-shell">
    <div class="hero-content">
        <h2 class="hero-title">Check Your <span class="highlight-text">Home Fiber</span> Availability</h2>
        <p class="hero-subtitle">
            Enter your address to see if fiber internet is available at your home.
        </p>
        <div class="availability-search-container">
            <div class="search-input-wrapper">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
                </svg>
                <input type="text" id="cfn-address-input" placeholder="Start entering your address..." autocomplete="off">
            </div>
            <div id="redirect-message" class="hidden">Taking you to the availability tool...</div>
        </div>
        <div class="business-contact">
            For commercial service availability, please call <a href="tel:5748312176">574.831.2176</a>
        </div>
    </div>
</div>

<script>
    (function markEmbeddedContext() {
        try {
            if (window.self !== window.top) {
                document.documentElement.classList.add('is-embedded');
            }
        } catch (_err) {
            document.documentElement.classList.add('is-embedded');
        }
    })();

    function bootCFNWidget() {
        var APP_ORIGIN = 'https://search.np-tech.com';
        var DEFAULT_SOURCE_SITE = 'npt_embed';
        var MIN_GOOGLE_SEARCH_TOKEN_COUNT = 3;
        var SEARCH_DEBOUNCE_MS = 350;
        var MAX_PREDICTIONS = 5;
        var PASSTHROUGH_KEYS = [
            'source_site',
            'utm_source',
            'utm_medium',
            'utm_campaign',
            'utm_adset',
            'utm_content',
            'campaign',
            'campaign_id',
            'campaign_name'
        ];
        var input = document.getElementById('cfn-address-input');
        var msg = document.getElementById('redirect-message');
        if (!input) return;

        var container = input.closest('.availability-search-container') || input.parentElement;
        var suggestions = document.createElement('div');
        var placesLoadPromise = null;
        var autocompleteService = null;
        var sessionToken = null;
        var debounceTimer = null;
        var latestRequestId = 0;
        var currentPredictions = [];
        var activeIndex = -1;
        var isRedirecting = false;

        suggestions.id = 'cfn-address-suggestions';
        suggestions.className = 'cfn-address-suggestions';
        suggestions.setAttribute('role', 'listbox');
        suggestions.hidden = true;
        container.appendChild(suggestions);

        input.setAttribute('aria-autocomplete', 'list');
        input.setAttribute('aria-controls', suggestions.id);

        function countSearchTokens(value) {
            var matches = String(value || '').match(/[A-Za-z0-9]/g);
            return matches ? matches.length : 0;
        }

        function hasMinimumGoogleSearchInput(value) {
            return countSearchTokens(value) >= MIN_GOOGLE_SEARCH_TOKEN_COUNT;
        }

        function escapeHtml(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function loadGooglePlaces() {
            if (window.google && window.google.maps && window.google.maps.places && window.google.maps.places.AutocompleteService) {
                return Promise.resolve(window.google.maps.places);
            }

            if (placesLoadPromise) {
                return placesLoadPromise;
            }

            placesLoadPromise = new Promise(function(resolve, reject) {
                if (!window.loadGoogleMapsFromSecret) {
                    reject(new Error('Google Maps loader is unavailable.'));
                    return;
                }

                var callbackName = '__cfnEmbedGooglePlacesReady';
                var settled = false;
                var timeoutId = window.setTimeout(function() {
                    finish(reject, new Error('Google Places took too long to load.'));
                }, 12000);

                function finish(handler, value) {
                    if (settled) return;
                    settled = true;
                    window.clearTimeout(timeoutId);
                    try {
                        delete window[callbackName];
                    } catch (_error) {
                        window[callbackName] = undefined;
                    }
                    handler(value);
                }

                window[callbackName] = function() {
                    if (window.google && window.google.maps && window.google.maps.places && window.google.maps.places.AutocompleteService) {
                        finish(resolve, window.google.maps.places);
                        return;
                    }
                    finish(reject, new Error('Google Places loaded without autocomplete support.'));
                };

                var loaderPromise = window.loadGoogleMapsFromSecret({
                    callbackName: callbackName,
                    libraries: ["places"]
                });

                if (loaderPromise && typeof loaderPromise.then === 'function') {
                    loaderPromise.then(function() {
                        if (window.google && window.google.maps && window.google.maps.places && window.google.maps.places.AutocompleteService) {
                            finish(resolve, window.google.maps.places);
                        }
                    }).catch(function(error) {
                        finish(reject, error);
                    });
                }
            });

            return placesLoadPromise;
        }

        function clearSuggestions() {
            currentPredictions = [];
            activeIndex = -1;
            suggestions.innerHTML = '';
            suggestions.hidden = true;
            input.removeAttribute('aria-activedescendant');
        }

        function setActiveIndex(index) {
            activeIndex = index;
            if (activeIndex < 0) {
                input.removeAttribute('aria-activedescendant');
            }
            Array.prototype.forEach.call(suggestions.querySelectorAll('.cfn-address-suggestion'), function(button, buttonIndex) {
                var isActive = buttonIndex === activeIndex;
                button.classList.toggle('is-active', isActive);
                if (isActive) {
                    input.setAttribute('aria-activedescendant', button.id);
                }
            });
        }

        function renderPredictions(predictions) {
            currentPredictions = predictions.slice(0, MAX_PREDICTIONS);
            if (currentPredictions.length === 0) {
                clearSuggestions();
                return;
            }

            suggestions.innerHTML = currentPredictions.map(function(prediction, index) {
                return '<button type="button" id="cfn-address-suggestion-' + index + '" class="cfn-address-suggestion" role="option" data-index="' + index + '">' +
                    escapeHtml(prediction.description) +
                    '</button>';
            }).join('');
            suggestions.hidden = false;
            setActiveIndex(-1);
        }

        function requestPredictions() {
            var value = input.value.trim();
            if (!hasMinimumGoogleSearchInput(value)) {
                clearSuggestions();
                return;
            }

            var requestId = ++latestRequestId;
            loadGooglePlaces()
                .then(function(places) {
                    autocompleteService = autocompleteService || new places.AutocompleteService();
                    sessionToken = sessionToken || new places.AutocompleteSessionToken();
                    autocompleteService.getPlacePredictions({
                        input: value,
                        types: ['address'],
                        componentRestrictions: { country: 'us' },
                        sessionToken: sessionToken
                    }, function(predictions, status) {
                        if (requestId !== latestRequestId || !hasMinimumGoogleSearchInput(input.value)) {
                            return;
                        }

                        if (status !== places.PlacesServiceStatus.OK || !Array.isArray(predictions)) {
                            clearSuggestions();
                            return;
                        }

                        renderPredictions(predictions);
                    });
                })
                .catch(function(error) {
                    console.error(error);
                    clearSuggestions();
                });
        }

        input.addEventListener('input', function() {
            window.clearTimeout(debounceTimer);
            if (!hasMinimumGoogleSearchInput(input.value)) {
                latestRequestId += 1;
                clearSuggestions();
                return;
            }
            debounceTimer = window.setTimeout(requestPredictions, SEARCH_DEBOUNCE_MS);
        });

        input.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowDown' && currentPredictions.length > 0) {
                e.preventDefault();
                setActiveIndex(Math.min(activeIndex + 1, currentPredictions.length - 1));
                return;
            }

            if (e.key === 'ArrowUp' && currentPredictions.length > 0) {
                e.preventDefault();
                setActiveIndex(Math.max(activeIndex - 1, 0));
                return;
            }

            if (e.key === 'Escape') {
                clearSuggestions();
                return;
            }

            if (e.key === 'Enter') {
                e.preventDefault();
                if (!isRedirecting) {
                    var selected = currentPredictions[activeIndex];
                    redirectToApp((selected && selected.description) || input.value);
                }
            }
        });

        suggestions.addEventListener('mousedown', function(e) {
            e.preventDefault();
        });

        suggestions.addEventListener('click', function(e) {
            var button = e.target.closest('.cfn-address-suggestion');
            if (!button) return;

            var prediction = currentPredictions[Number(button.dataset.index)];
            if (prediction && prediction.description) {
                input.value = prediction.description;
                clearSuggestions();
                sessionToken = null;
                redirectToApp(prediction.description);
            }
        });

        document.addEventListener('click', function(e) {
            if (!container.contains(e.target)) {
                clearSuggestions();
            }
        });

        function applyAttributionParams(targetUrl) {
            var pageParams = new URLSearchParams(window.location.search || '');
            var sourceSite = pageParams.get('source_site') || DEFAULT_SOURCE_SITE;
            targetUrl.searchParams.set('source_site', sourceSite);

            PASSTHROUGH_KEYS.forEach(function(key) {
                if (key === 'source_site') return;
                var value = pageParams.get(key);
                if (value && value.trim()) {
                    targetUrl.searchParams.set(key, value.trim());
                }
            });

            if (window.UTMAttribution && typeof window.UTMAttribution.buildEventPayload === 'function') {
                var payload = window.UTMAttribution.buildEventPayload({ source_site: sourceSite });
                ['utm_source', 'utm_medium', 'utm_campaign', 'utm_adset', 'utm_content'].forEach(function(key) {
                    if (targetUrl.searchParams.get(key)) return;
                    var value = payload && payload[key];
                    if (value && value !== 'organic / unknown') {
                        targetUrl.searchParams.set(key, value);
                    }
                });

                if (!targetUrl.searchParams.get('campaign') && payload && payload.campaign_at_search_time_id) {
                    targetUrl.searchParams.set('campaign', payload.campaign_at_search_time_id);
                }
            }
        }

        function redirectToApp(address) {
            if (isRedirecting) return;

            if (hasMinimumGoogleSearchInput(address)) {
                isRedirecting = true;

                input.style.borderColor = "#2563eb";
                input.style.backgroundColor = "#eff6ff";
                if (msg) msg.classList.remove('hidden');

                var targetUrl = new URL('/query.html', APP_ORIGIN);
                targetUrl.searchParams.set('auto', 'true');
                targetUrl.searchParams.set('address', address);
                applyAttributionParams(targetUrl);

                var url = targetUrl.toString();
                var newTab = window.open(url, '_blank');
                if (newTab) {
                    newTab.opener = null;
                } else {
                    window.location.href = url;
                }
            }
        }
    }
</script>
<script src="https://search.np-tech.com/maps-loader.js"></script>
<script src="https://search.np-tech.com/utm-attribution.js"></script>
<script>
    bootCFNWidget();
</script>

</body>
</html>
